name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # Publish only the public website. The backend source, the staff manager page and
      # anything else in the repo stay out of the public site.
      - name: Assemble public site
        run: |
          mkdir _site
          cp index.html script.js styles.css hotel-explorer.css _site/
          cp -R assets _site/
          cp BOXWOOD-PROJECT-ROADMAP.html BOXWOOD-PROJECT-ROADMAP.pdf BOXWOOD-AGILE-CYCLE-SUMMARY.pdf _site/
      # config.js tells the page where the enquiry API lives. It comes from the BOXWOOD_API_BASE
      # repository variable; when that is empty the page shows "Online enquiries open soon".
      - name: Point the site at the enquiry API
        env:
          API_BASE: ${{ vars.BOXWOOD_API_BASE }}
        run: |
          API_BASE="${API_BASE%/}"
          if [ -n "$API_BASE" ] && ! printf '%s' "$API_BASE" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?$'; then
            echo "BOXWOOD_API_BASE must look like https://api.example.com" >&2
            exit 1
          fi
          printf 'window.BOXWOOD_API_BASE = "%s";\n' "$API_BASE" > _site/config.js
          if [ -n "$API_BASE" ]; then
            sed -i "s#http://localhost:5050#$API_BASE#g" _site/index.html
          else
            sed -i "s# http://localhost:5050##g" _site/index.html
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
