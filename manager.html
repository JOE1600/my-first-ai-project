<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' http://localhost:5050; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Boxwood enquiry manager</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="manager.css">
  <script src="manager.js" defer></script>
</head>
<body>
  <h1>Boxwood enquiry manager</h1>
  <p>Private read-only view of enquiries saved by the game-night website.</p>
  <form id="manager-form">
    <label>API address <input id="api-base" value="http://localhost:5050" required></label>
    <label>Manager key <input id="admin-key" type="password" autocomplete="current-password" required></label>
    <button type="submit">Load enquiries</button>
  </form>
  <p class="status" id="status" role="status" aria-live="polite">Enter the manager key to load saved enquiries.</p>
  <div id="results"></div>
</body>
</html>
